<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kitty Solitaire</title>
<meta name="theme-color" content="#1d2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitty Solitaire">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"><div class="bgl"></div><div class="bgl"></div></div>

<!-- Main menu -->
<section id="menu" class="screen">
  <button id="quitApp" class="quit-btn" aria-label="Quit the app" hidden>
    <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.190 1.010-4.140 2.580-5.420L6.170 5.170C4.230 6.820 3 9.260 3 12c0 4.970 4.030 9 9 9s9-4.030 9-9c0-2.740-1.230-5.180-3.170-6.830z"/></svg>
  </button>
  <div class="menu-box">
    <img class="kitty" src="img/sacchi.jpg" alt="Sacchi the kitten" draggable="false">
    <h1>Kitty Solitaire</h1>
    <button id="btnContinue" class="btn primary" hidden>Continue</button>
    <button id="btnNew" class="btn primary">New Game</button>
    <div id="offline" hidden>&#10003; Ready for offline play</div>
  </div>
</section>

<!-- Game -->
<section id="game" class="screen" hidden>
  <div id="board"></div>
  <div id="hud">
    <button id="cog" class="ibtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path class="gear" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z"/><circle cx="12" cy="12" r="4.1" fill="#2f8fe6"/><circle cx="12" cy="12" r="2.1" fill="#f4f6f9"/></svg>
    </button>
    <div class="hud-right">
      <button id="undo" class="ibtn" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button id="hint" class="ibtn" aria-label="Hint">
        <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
      </button>
    </div>
  </div>
  <div id="toast"></div>
</section>

<canvas id="fx" hidden></canvas>

<!-- New game -->
<div id="dlgNew" class="dlg">
  <div class="panel">
    <h2>New Game</h2>
    <div class="label">Number of suits</div>
    <div class="seg" id="suitSeg">
      <button data-s="1">1</button><button data-s="2">2</button><button data-s="3">3</button><button data-s="4">4</button>
    </div>
    <div class="sub" id="suitDesc"></div>
    <label class="toggle">
      <input type="checkbox" id="optEmptyDeal">
      <span class="switch"></span>
      <span>Allow dealing cards on empty columns</span>
    </label>
    <div class="row">
      <button class="btn" id="newCancel">Cancel</button>
      <button class="btn primary" id="newStart">Start</button>
    </div>
  </div>
</div>

<!-- In-game menu -->
<div id="dlgMenu" class="dlg">
  <div class="panel">
    <h2>Paused</h2>
    <div class="stats" id="menuStats"></div>
    <div class="grid">
      <button class="btn primary" id="mResume">Resume</button>
      <button class="btn" id="mNew">New Game</button>
      <button class="btn" id="mRestart">Restart</button>
      <button class="btn" id="mQuit">Quit to Main Menu</button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div id="dlgConfirm" class="dlg">
  <div class="panel">
    <h2 id="confirmText">Are you sure?</h2>
    <div class="row">
      <button class="btn" id="confirmNo">No</button>
      <button class="btn primary" id="confirmYes">Yes</button>
    </div>
  </div>
</div>

<!-- Win -->
<div id="dlgWin" class="dlg clear">
  <div class="panel">
    <img class="kitty small" src="img/sacchi.jpg" alt="" draggable="false">
    <h2>You won!</h2>
    <div class="stats" id="winStats"></div>
    <div class="row">
      <button class="btn" id="wMenu">Main Menu</button>
      <button class="btn primary" id="wNew">New Game</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
